name: Build Guide

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ciscodocs/ci-image-v2:latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The prebaked container ships with mkdocs + mkdocs-material + a small
      # baseline of plugins, but not the lab-specific extras (glightbox,
      # with-pdf, etc.). Install the full pinned list from requirements.txt
      # so the build is reproducible and survives image refreshes.
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Build
        run: mkdocs build --clean
